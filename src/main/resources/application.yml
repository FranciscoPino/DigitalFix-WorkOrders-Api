spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ms-digitalfix-workorders
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digitalfix}?sslmode=${DB_SSL_MODE:require}
    username: ${DB_USER:digitalfix_admin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: workorders
    open-in-view: false
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: ${RABBITMQ_VHOST:/}
server:
  port: ${SERVER_PORT:8081}
